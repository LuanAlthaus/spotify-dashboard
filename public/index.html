<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="grain"></div>

  <!-- Palco fixo de 1920x1080 (o script.js escala para a tela) -->
  <main class="stage" id="stage">

    <!-- Relógio e data -->
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">---</div>

    <!-- Topo direito: nome, clima e sistema -->
    <div class="user-name" id="user-name"></div>
    <div class="vline v1"></div>
    <div class="weather">
      <div class="weather-row">
        <span id="weather-icon"></span>
        <span class="weather-temp" id="weather-temp">--°C</span>
      </div>
      <div class="weather-city" id="weather-city"></div>
      <div class="stats-line">
        <span>CPU <b id="stat-cpu">--%</b></span>
        <span>RAM <b id="stat-ram">--%</b></span>
      </div>
    </div>

    <div class="hline"></div>

    <!-- Tocando agora -->
    <section class="player">
      <div class="np-idle" id="np-idle">Silêncio no momento</div>

      <div class="np-active" id="np-active" hidden>
        <img class="np-art" id="np-art" alt="" />
        <div class="np-info">
          <div class="label">Tocando agora</div>
          <div class="np-track" id="np-track"></div>
          <div class="np-artist" id="np-artist"></div>

          <div class="progress"><div class="progress-fill" id="np-progress"></div></div>
          <div class="times">
            <span id="np-time-now">0:00</span>
            <span id="np-time-left">-0:00</span>
          </div>

          <!-- Botões só decorativos (o de pause/play troca sozinho) -->
          <div class="controls">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="2.2" height="14"/><path d="M19 5v14L8 12z"/></svg>
            <div class="play-btn">
              <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
              <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 4v16l13-8z"/></svg>
            </div>
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="17.8" y="5" width="2.2" height="14"/><path d="M5 5v14l11-7z"/></svg>
            <div class="bars" id="bars"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="vline v2"></div>

    <!-- Em foco (fila) -->
    <section class="queue" id="queue" hidden>
      <div class="label">Em foco</div>
      <div class="queue-list" id="queue-list"></div>
    </section>

    <div class="vline v3"></div>

    <!-- Hoje -->
    <section class="today">
      <div class="label">Hoje</div>
      <div class="today-date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="today-date">--</span>
      </div>
      <div class="today-phrase" id="today-phrase"></div>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="frases.js"></script>
  <script src="script.js"></script>
</body>
</html>
